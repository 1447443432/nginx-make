name: Build nginx

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: "nginx version (optional, default from config/nginx-version.conf)"
        required: false
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - 'build-nginx.sh'
      - 'build.sh'
      - 'config/**'
      - 'docker/**'
      - 'modules/**'
      - 'nginx/**'

permissions:
  contents: write

jobs:
  build:
    name: Build nginx (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build nginx
        run: |
          chmod +x build-nginx.sh
          chmod +x build.sh
          if [ -n "${{ github.event.inputs.nginx_version }}" ]; then
            ./build-nginx.sh \
              "${{ matrix.arch }}" \
              "${{ github.event.inputs.nginx_version }}"
          else
            ./build-nginx.sh \
              "${{ matrix.arch }}"
          fi

      - name: Verify sha256
        run: |
          sha256sum -c output/*.sha256

      - name: Show output
        run: |
          ls -lh output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ matrix.arch }}
          path: |
            output/*.tar.gz
            output/*.sha256
            output/build-info.txt

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read nginx version
        id: version
        run: |
          source config/nginx-version.conf
          echo "version=${NGINX_VERSION}" >> $GITHUB_OUTPUT

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge files
        run: |
          mkdir release

          find artifacts \
            -type f \
            \( \
              -name "*.tar.gz" \
              -o -name "*.sha256" \
            \) \
            -exec cp {} release/ \;

          ls -lh release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nginx-${{ steps.version.outputs.version }}
          name: nginx-${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            release/*