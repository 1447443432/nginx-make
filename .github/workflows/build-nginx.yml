name: Build nginx

on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: "nginx version; empty uses config/nginx-version.conf"
        required: false
        type: string
      enable_sub_filter:
        description: "Build ngx_http_substitutions_filter_module"
        required: true
        default: true
        type: boolean
      enable_proxy_connect:
        description: "Build ngx_http_proxy_connect_module"
        required: true
        default: true
        type: boolean
      enable_upstream_check:
        description: "Build nginx_upstream_check_module"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - master
    paths:
      - "Dockerfile"
      - "build-nginx.sh"
      - "build.sh"
      - "config/**"
      - "docker/**"
      - "modules/**"
      - "nginx/**"
      - ".github/workflows/build-nginx.yml"

permissions:
  contents: write

env:
  ARTIFACT_RETENTION_DAYS: "7"

jobs:
  resolve:
    name: Resolve nginx version
    runs-on: ubuntu-latest
    outputs:
      nginx_version: ${{ steps.resolve.outputs.nginx_version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      enable_sub_filter: ${{ steps.resolve.outputs.enable_sub_filter }}
      enable_proxy_connect: ${{ steps.resolve.outputs.enable_proxy_connect }}
      enable_upstream_check: ${{ steps.resolve.outputs.enable_upstream_check }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve build metadata
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.nginx_version }}
          INPUT_ENABLE_SUB_FILTER: ${{ inputs.enable_sub_filter }}
          INPUT_ENABLE_PROXY_CONNECT: ${{ inputs.enable_proxy_connect }}
          INPUT_ENABLE_UPSTREAM_CHECK: ${{ inputs.enable_upstream_check }}
        run: |
          set -euo pipefail
          source config/nginx-version.conf
          VERSION="${INPUT_VERSION:-${NGINX_VERSION:-}}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid nginx version: ${VERSION}" >&2
            exit 1
          fi
          ENABLE_SUB_FILTER="${INPUT_ENABLE_SUB_FILTER:-true}"
          ENABLE_PROXY_CONNECT="${INPUT_ENABLE_PROXY_CONNECT:-true}"
          ENABLE_UPSTREAM_CHECK="${INPUT_ENABLE_UPSTREAM_CHECK:-true}"
          for value in "${ENABLE_SUB_FILTER}" "${ENABLE_PROXY_CONNECT}" "${ENABLE_UPSTREAM_CHECK}"; do
            if [[ "${value}" != "true" && "${value}" != "false" ]]; then
              echo "invalid module switch: ${value}" >&2
              exit 1
            fi
          done
          RELEASE_TAG="nginx-${VERSION}"
          echo "nginx_version=${VERSION}" >>"${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >>"${GITHUB_OUTPUT}"
          echo "enable_sub_filter=${ENABLE_SUB_FILTER}" >>"${GITHUB_OUTPUT}"
          echo "enable_proxy_connect=${ENABLE_PROXY_CONNECT}" >>"${GITHUB_OUTPUT}"
          echo "enable_upstream_check=${ENABLE_UPSTREAM_CHECK}" >>"${GITHUB_OUTPUT}"
          read_build_var()
          {
            local key="$1"
            sed -n "s/^${key}=\"\\([^\"]*\\)\"$/\\1/p" build.sh | head -n 1
          }
          SUB_FILTER_VERSION="$(read_build_var SUB_FILTER_VERSION)"
          PROXY_CONNECT_VERSION="$(read_build_var PROXY_CONNECT_VERSION)"
          UPSTREAM_CHECK_VERSION="$(read_build_var UPSTREAM_CHECK_VERSION)"
          OPENSSL_VERSION="$(read_build_var OPENSSL_VERSION)"
          PCRE_VERSION="$(read_build_var PCRE_VERSION)"
          ZLIB_VERSION="$(read_build_var ZLIB_VERSION)"
          {
            echo "## nginx build configuration"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Architectures: \`amd64\`, \`arm64\`"
            echo "- Release tag: \`${RELEASE_TAG}\`"
            echo "- substitutions filter: \`${ENABLE_SUB_FILTER}\`"
            echo "- proxy connect: \`${ENABLE_PROXY_CONNECT}\`"
            echo "- upstream check: \`${ENABLE_UPSTREAM_CHECK}\`"
            echo "- Custom modules:"
            echo "  - ngx_http_substitutions_filter_module: \`${SUB_FILTER_VERSION}\`"
            echo "  - ngx_http_proxy_connect_module: \`${PROXY_CONNECT_VERSION}\`"
            echo "  - nginx_upstream_check_module: \`${UPSTREAM_CHECK_VERSION}\`"
            echo "- Build dependencies:"
            echo "  - OpenSSL: \`${OPENSSL_VERSION}\`"
            echo "  - PCRE: \`${PCRE_VERSION}\`"
            echo "  - zlib: \`${ZLIB_VERSION}\`"
            echo "- Built-in modules: \`http_sub\`, \`http_ssl\`, \`http_v2\`, \`http_realip\`, \`http_gzip_static\`, \`http_stub_status\`, \`http_slice\`, \`http_auth_request\`, \`http_secure_link\`, \`stream\`, \`stream_ssl\`, \`threads\`"
          } >>"${GITHUB_STEP_SUMMARY}"

  build:
    name: Build nginx ${{ matrix.architecture }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ENABLE_SUB_FILTER: ${{ needs.resolve.outputs.enable_sub_filter }}
      ENABLE_PROXY_CONNECT: ${{ needs.resolve.outputs.enable_proxy_connect }}
      ENABLE_UPSTREAM_CHECK: ${{ needs.resolve.outputs.enable_upstream_check }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build nginx
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          chmod +x build-nginx.sh build.sh
          echo "architecture=${{ matrix.architecture }}"
          echo "platform=${TARGET_PLATFORM}"
          ./build-nginx.sh "${{ matrix.architecture }}" "${{ needs.resolve.outputs.nginx_version }}"
      - name: Show build output
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          echo "========== ${{ matrix.architecture }} output =========="
          if [ -d output ]; then
            find output -maxdepth 1 -type f -printf '%f\n' | sort
            ls -lh output
            [ ! -f output/build-info.txt ] || cat output/build-info.txt
          else
            echo "output directory not found"
          fi
      - name: Verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd output
          sha256sum -c *.sha256
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: nginx-${{ matrix.architecture }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
          compression-level: 0
          path: |
            output/*.tar.gz
            output/*.sha256
            output/build-info.txt

  release:
    name: Create Release
    needs:
      - resolve
      - build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.resolve.outputs.nginx_version }}
      tag: ${{ needs.resolve.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Merge release files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release/ \;
          cp artifacts/nginx-amd64/build-info.txt release/build-info-amd64.txt
          cp artifacts/nginx-arm64/build-info.txt release/build-info-arm64.txt
          test "$(find release -maxdepth 1 -type f -name '*-amd64.tar.gz' | wc -l)" -eq 1
          test "$(find release -maxdepth 1 -type f -name '*-arm64.tar.gz' | wc -l)" -eq 1
          ls -lh release
      - name: Create or update Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: ${{ needs.resolve.outputs.release_tag }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release/*
      - name: Show Release information
        shell: bash
        env:
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
          RELEASE_ASSETS: ${{ steps.create_release.outputs.assets }}
        run: |
          set -euo pipefail
          echo "repository=${GITHUB_REPOSITORY}"
          echo "release_tag=${{ needs.resolve.outputs.release_tag }}"
          echo "release_url=${RELEASE_URL}"
          echo "========== release assets =========="
          jq -r '.[] | "\(.name) -> \(.browser_download_url)"' <<<"${RELEASE_ASSETS}"
          {
            echo "## Release"
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Tag: \`${{ needs.resolve.outputs.release_tag }}\`"
            echo "- URL: ${RELEASE_URL}"
            echo
            echo "| Asset | Download URL |"
            echo "|---|---|"
            jq -r '.[] | "| \(.name) | \(.browser_download_url) |"' <<<"${RELEASE_ASSETS}"
          } >>"${GITHUB_STEP_SUMMARY}"

  sync-hap:
    name: Sync Release to HAP
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release.outputs.version }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      HAP_WEBHOOK_URL: ${{ secrets.HAP_WEBHOOK_URL }}
    steps:
      - name: Check HAP configuration
        id: hap
        shell: bash
        run: |
          if [ -n "${HAP_WEBHOOK_URL:-}" ]; then
            echo "enabled=true" >>"${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >>"${GITHUB_OUTPUT}"
          fi
      - name: Show HAP sync status
        shell: bash
        env:
          HAP_ENABLED: ${{ steps.hap.outputs.enabled }}
        run: |
          set -euo pipefail
          if [ "${HAP_ENABLED}" = "true" ]; then
            echo "HAP sync enabled"
          else
            echo "HAP_WEBHOOK_URL is not configured; skip HAP sync"
          fi
      - name: Download artifacts
        if: steps.hap.outputs.enabled == 'true'
        uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Prepare HAP payload
        if: steps.hap.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AMD64_FILE="$(find artifacts/nginx-amd64 -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          ARM64_FILE="$(find artifacts/nginx-arm64 -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          AMD64_SHA_FILE="$(find artifacts/nginx-amd64 -maxdepth 1 -type f -name '*.sha256' -print -quit)"
          ARM64_SHA_FILE="$(find artifacts/nginx-arm64 -maxdepth 1 -type f -name '*.sha256' -print -quit)"
          test -n "${AMD64_FILE}" -a -n "${ARM64_FILE}" -a -n "${AMD64_SHA_FILE}" -a -n "${ARM64_SHA_FILE}"
          AMD64_NAME="$(basename "${AMD64_FILE}")"
          ARM64_NAME="$(basename "${ARM64_FILE}")"
          AMD64_SHA256="$(awk 'NR==1{print $1}' "${AMD64_SHA_FILE}")"
          ARM64_SHA256="$(awk 'NR==1{print $1}' "${ARM64_SHA_FILE}")"
          [[ "${AMD64_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "${ARM64_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          RELEASE_URL="$(jq -r '.html_url // empty' <<<"${RELEASE_JSON}")"
          AMD64_URL="$(jq -r --arg n "${AMD64_NAME}" '[.assets[] | select(.name == $n) | .browser_download_url][0] // empty' <<<"${RELEASE_JSON}")"
          ARM64_URL="$(jq -r --arg n "${ARM64_NAME}" '[.assets[] | select(.name == $n) | .browser_download_url][0] // empty' <<<"${RELEASE_JSON}")"
          test -n "${RELEASE_URL}" -a -n "${AMD64_URL}" -a -n "${ARM64_URL}"
          ATTACHMENT_URLS="$(jq -cn --arg amd64 "${AMD64_URL}" --arg arm64 "${ARM64_URL}" '[$amd64,$arm64]')"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n \
            --arg project_name "nginx" --arg repository "${GITHUB_REPOSITORY}" --arg version "${VERSION}" --arg tag "${RELEASE_TAG}" \
            --arg release_url "${RELEASE_URL}" --arg amd64_name "${AMD64_NAME}" --arg amd64_url "${AMD64_URL}" \
            --arg amd64_sha256 "${AMD64_SHA256}" --arg arm64_name "${ARM64_NAME}" --arg arm64_url "${ARM64_URL}" \
            --arg arm64_sha256 "${ARM64_SHA256}" --arg attachment_urls "${ATTACHMENT_URLS}" \
            --arg commit_sha "${GITHUB_SHA}" --arg run_id "${GITHUB_RUN_ID}" --arg run_url "${RUN_URL}" \
            '{project_name:$project_name,repository:$repository,version:$version,tag:$tag,release_url:$release_url,amd64_name:$amd64_name,amd64_url:$amd64_url,amd64_sha256:$amd64_sha256,arm64_name:$arm64_name,arm64_url:$arm64_url,arm64_sha256:$arm64_sha256,attachment_urls:$attachment_urls,commit_sha:$commit_sha,run_id:$run_id,run_url:$run_url,build_status:"success"}' \
            >hap-payload.json
          jq -e '(.attachment_urls|type)=="string" and ((.attachment_urls|fromjson|type)=="array") and ((.attachment_urls|fromjson|length)==2)' hap-payload.json >/dev/null
          jq . hap-payload.json
      - name: Send release information to HAP
        if: steps.hap.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @hap-payload.json \
            "${HAP_WEBHOOK_URL}"
