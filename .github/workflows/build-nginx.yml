name: Build nginx

on:
  workflow_dispatch:

jobs:

  build:

    strategy:
      matrix:
        arch:
          - amd64
          - arm64

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup QEMU
      uses: docker/setup-qemu-action@v3


    - name: Setup Buildx
      uses: docker/setup-buildx-action@v3


    - name: Build nginx

      run: |

        chmod +x build-nginx.sh

        ./build-nginx.sh ${{ matrix.arch }}


    - name: Verify sha256

      run: |

        sha256sum -c output/*.sha256


    - name: Upload artifact

      uses: actions/upload-artifact@v4

      with:

        name: nginx-${{ matrix.arch }}

        path: |
          output/*.tar.gz
          output/*.sha256
          output/build-info.txt



  release:

    needs: build

    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4


    - name: Read version

      id: version

      run: |

        source config/nginx-version.conf

        echo "release=${RELEASE_VERSION}" >> $GITHUB_OUTPUT



    - name: Download artifact

      uses: actions/download-artifact@v4

      with:

        path: artifacts



    - name: Merge files

      run: |

        mkdir release

        find artifacts \
        -type f \
        -exec cp {} release/ \;



    - name: Create Release

      uses: softprops/action-gh-release@v2

      with:

        tag_name: ${{ steps.version.outputs.release }}

        name: nginx ${{ steps.version.outputs.release }}

        files: |
          release/*